<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News &amp; Announcements — Sibaihua University</title>
  <meta name="description" content="News, announcements and notices from Sibaihua University, Chiang Mai Campus.">
  <link rel="icon" href="https://cdn.sibh.cn/img/2026/08/6a82000f8ce84.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --brand: #1e3a5f;
      --brand-dark: #142740;
      --brand-subtle: #5a7394;
      --bg: #ffffff;
      --bg-soft: #f8fafc;
      --border: #e2e8f0;
      --border-soft: #f1f5f9;
      --text: #1e293b;
      --text-mid: #475569;
      --text-mute: #64748b;
      --text-faint: #94a3b8;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.65;
    }

    h1, h2, h3, p, ul, ol, blockquote, figure { margin: 0; }
    a { color: inherit; text-decoration: none; }

    .wrap { max-width: 46rem; margin: 0 auto; padding: 0 1.25rem; }

    /* ── header ──────────────────────────────────────────────────────── */
    header.site {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .site-inner {
      max-width: 60rem; margin: 0 auto; padding: 0.8rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .site-brand { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
    .site-brand img {
      width: 2.1rem; height: 2.1rem; border-radius: 9999px;
      border: 1px solid var(--border); padding: 3px; object-fit: contain;
    }
    .site-name { font-size: 0.9rem; font-weight: 700; color: var(--brand); letter-spacing: -0.01em; line-height: 1.15; }
    .site-sub { font-size: 0.68rem; color: var(--text-faint); line-height: 1.2; margin-top: 2px; }

    .home-link {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.45rem 0.85rem; border-radius: 9999px;
      border: 1px solid var(--border); background: #fff;
      font-size: 0.75rem; font-weight: 550; color: var(--text-mid);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .home-link:hover { background: var(--bg-soft); color: var(--brand); border-color: #cbd5e1; }

    /* ── page head ───────────────────────────────────────────────────── */
    .page-head { padding: 3rem 0 1.75rem; }
    .eyebrow {
      font-size: 0.68rem; font-weight: 650; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--brand-subtle); margin-bottom: 0.6rem;
    }
    .page-head h1 {
      font-size: 1.85rem; font-weight: 700; color: var(--brand);
      letter-spacing: -0.025em; line-height: 1.2;
    }
    .page-head p { margin-top: 0.6rem; font-size: 0.9rem; color: var(--text-mute); max-width: 34rem; }

    /* ── list ────────────────────────────────────────────────────────── */
    .posts { padding-bottom: 4rem; }
    .post-card {
      display: block; padding: 1.4rem 0;
      border-top: 1px solid var(--border-soft);
      transition: opacity 0.15s;
    }
    .post-card:first-child { border-top: 0; }
    .post-card:hover { opacity: 0.82; }
    .post-date {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-faint);
    }
    .post-card h2 {
      margin-top: 0.4rem; font-size: 1.12rem; font-weight: 650;
      color: var(--brand); letter-spacing: -0.015em; line-height: 1.35;
    }
    .post-card p { margin-top: 0.45rem; font-size: 0.85rem; color: var(--text-mute); }
    .post-more {
      display: inline-flex; align-items: center; gap: 0.35rem;
      margin-top: 0.65rem; font-size: 0.75rem; font-weight: 600; color: var(--brand);
    }

    /* ── article ─────────────────────────────────────────────────────── */
    .article { padding-bottom: 4rem; }
    .article-back {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin: 1.75rem 0 1.25rem; font-size: 0.75rem; font-weight: 600; color: var(--brand-subtle);
    }
    .article-back:hover { color: var(--brand); }
    .article h1 {
      font-size: 1.9rem; font-weight: 700; color: var(--brand);
      letter-spacing: -0.03em; line-height: 1.22;
    }
    .article-meta {
      margin-top: 0.7rem; padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text-faint);
      display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    }
    .article-body { padding-top: 1.6rem; font-size: 1rem; color: var(--text-mid); }
    .article-body > * + * { margin-top: 1.05rem; }
    .article-body h2 {
      font-size: 1.3rem; font-weight: 700; color: var(--brand);
      letter-spacing: -0.02em; line-height: 1.3; margin-top: 2rem;
    }
    .article-body h3 { font-size: 1.1rem; font-weight: 650; color: var(--brand); margin-top: 1.75rem; }
    .article-body h4 { font-size: 1rem; font-weight: 650; color: var(--text); margin-top: 1.5rem; }
    .article-body p { line-height: 1.8; }
    .article-body strong { color: var(--text); font-weight: 650; }
    .article-body a {
      color: var(--brand); font-weight: 550;
      border-bottom: 1px solid rgba(30, 58, 95, 0.3);
    }
    .article-body a:hover { border-bottom-color: var(--brand); }
    .article-body ul, .article-body ol { padding-left: 1.35rem; }
    .article-body li { margin-top: 0.35rem; line-height: 1.75; }
    .article-body ul { list-style: disc; }
    .article-body ol { list-style: decimal; }
    .article-body blockquote {
      padding: 0.35rem 0 0.35rem 1rem;
      border-left: 3px solid rgba(30, 58, 95, 0.35);
      color: var(--text-mute); font-style: italic;
    }
    .article-body hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
    .article-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.86em; background: var(--bg-soft);
      border: 1px solid var(--border); border-radius: 0.35rem;
      padding: 0.08rem 0.32rem; color: var(--brand-dark);
    }

    /* ── states ──────────────────────────────────────────────────────── */
    .state {
      padding: 3.5rem 0 5rem; text-align: center; color: var(--text-faint); font-size: 0.88rem;
    }
    .state i { display: block; font-size: 1.6rem; margin-bottom: 0.75rem; opacity: 0.5; }
    .state a { color: var(--brand); font-weight: 600; }

    footer.site {
      border-top: 1px solid var(--border);
      padding: 1.5rem 1.25rem 2.5rem;
      text-align: center; font-size: 0.72rem; color: var(--text-faint);
    }
    footer.site a { color: var(--brand-subtle); }
    footer.site a:hover { color: var(--brand); }

    @media (min-width: 640px) {
      .page-head { padding: 4rem 0 2rem; }
      .page-head h1 { font-size: 2.25rem; }
      .article h1 { font-size: 2.35rem; }
    }
  </style>
</head>
<body>

  <header class="site">
    <div class="site-inner">
      <a class="site-brand" href="./index.html">
        <img src="https://cdn.sibh.cn/img/2026/08/6a82000f8ce84.png" alt="Sibaihua University Crest">
        <div>
          <div class="site-name">Sibaihua University</div>
          <div class="site-sub">Chiang Mai Campus</div>
        </div>
      </a>
      <a class="home-link" href="./index.html">
        <i class="fa-solid fa-arrow-left"></i><span>Back to home</span>
      </a>
    </div>
  </header>

  <main id="main" class="wrap">
    <div class="state"><i class="fa-solid fa-circle-notch fa-spin"></i>Loading…</div>
  </main>

  <footer class="site">
    © 2026 Sibaihua University · <a href="./index.html">sibaihua.com</a>
  </footer>

  <script>
    const esc = (value) =>
      String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));

    const parseDate = (value) => {
      if (!value) return null;
      const text = String(value);
      const iso = /Z$|[+-]\d{2}:?\d{2}$/.test(text) ? text : text.replace(' ', 'T') + 'Z';
      const date = new Date(iso);
      return Number.isNaN(date.getTime()) ? null : date;
    };

    const fmtDate = (value) => {
      const date = parseDate(value);
      if (!date) return '';
      return date.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
    };

    const main = document.getElementById('main');

    const stateBlock = (icon, message, extra) =>
      '<div class="state"><i class="' + icon + '"></i>' + message + (extra || '') + '</div>';

    const fetchJson = async (url) => {
      const res = await fetch(url, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
      let payload = null;
      try { payload = await res.json(); } catch (err) { payload = null; }
      if (!res.ok || !payload || payload.code !== 200) {
        const error = new Error((payload && payload.message) || ('HTTP ' + res.status));
        error.status = res.status;
        throw error;
      }
      return payload.data;
    };

    const renderList = async () => {
      let data;
      try {
        data = await fetchJson('/api/posts?limit=50');
      } catch (err) {
        main.innerHTML = stateBlock(
          'fa-solid fa-triangle-exclamation',
          'News is temporarily unavailable.',
          '<div style="margin-top:0.6rem;font-size:0.8rem">' + esc(err.message) + '</div>'
        );
        return;
      }

      const posts = data.posts || [];
      if (!posts.length) {
        main.innerHTML =
          '<div class="page-head">' +
            '<div class="eyebrow">Newsroom</div>' +
            '<h1>News &amp; Announcements</h1>' +
            '<p>Official notices and updates from the university.</p>' +
          '</div>' +
          stateBlock('fa-regular fa-file-lines', 'No announcements have been published yet.',
            '<div style="margin-top:0.8rem"><a href="./index.html">Return to the university homepage</a></div>');
        return;
      }

      main.innerHTML =
        '<div class="page-head">' +
          '<div class="eyebrow">Newsroom</div>' +
          '<h1>News &amp; Announcements</h1>' +
          '<p>Official notices and updates from the university.</p>' +
        '</div>' +
        '<div class="posts">' +
          posts.map((post) => {
            const href = './news.html?id=' + encodeURIComponent(post.id);
            const date = fmtDate(post.published_at || post.created_at);
            return '' +
              '<a class="post-card" href="' + href + '">' +
                (date ? '<div class="post-date">' + esc(date) + '</div>' : '') +
                '<h2>' + esc(post.title) + '</h2>' +
                (post.excerpt ? '<p>' + esc(post.excerpt) + '</p>' : '') +
                '<span class="post-more">Read article <i class="fa-solid fa-arrow-right"></i></span>' +
              '</a>';
          }).join('') +
        '</div>';
    };

    const renderDetail = async (key) => {
      let data;
      try {
        data = await fetchJson('/api/posts/' + encodeURIComponent(key));
      } catch (err) {
        const message = err.status === 404
          ? 'This article could not be found.'
          : 'This article is temporarily unavailable.';
        main.innerHTML =
          stateBlock('fa-solid fa-triangle-exclamation', message,
            '<div style="margin-top:0.8rem"><a href="./news.html">Back to all news</a></div>');
        return;
      }

      const post = data.post;
      const date = fmtDate(post.published_at || post.created_at);
      document.title = post.title + ' — Sibaihua University';

      main.innerHTML =
        '<div class="article">' +
          '<a class="article-back" href="./news.html"><i class="fa-solid fa-arrow-left"></i><span>All news</span></a>' +
          '<h1>' + esc(post.title) + '</h1>' +
          '<div class="article-meta">' +
            (date ? '<span>' + esc(date) + '</span>' : '') +
            '<span>·</span><span>Sibaihua University</span>' +
          '</div>' +
          (post.content_html
            ? '<div class="article-body">' + post.content_html + '</div>'
            : '<div class="article-body"><p>This article has no content yet.</p></div>') +
        '</div>';
    };

    const params = new URLSearchParams(window.location.search);
    const key = params.get('id') || params.get('slug');
    if (key) {
      renderDetail(key);
    } else {
      renderList();
    }
  </script>
</body>
</html>
