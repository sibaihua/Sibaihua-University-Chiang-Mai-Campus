<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>正在完成登录 — Sibaihua University</title>
  <link rel="icon" href="https://cdn.sibh.cn/img/2026/08/6a82000f8ce84.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --brand: #1e3a5f;
      --brand-dark: #142740;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-mute: #64748b;
      --text-faint: #94a3b8;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --danger-border: #fecdca;
      --ok: #067647;
      --ok-bg: #ecfdf3;
      --ok-border: #abefc6;
      --radius: 0.75rem;
      --shadow-md: 0 10px 30px -16px rgba(15, 23, 42, 0.28);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 27rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 2rem 1.75rem;
      text-align: center;
    }
    .crest {
      width: 3.25rem;
      height: 3.25rem;
      object-fit: contain;
      margin-bottom: 1rem;
    }
    h1 { margin: 0; font-size: 1.05rem; font-weight: 650; color: var(--brand); letter-spacing: -0.015em; }
    .lede { margin: 0.5rem 0 0; font-size: 0.8rem; line-height: 1.7; color: var(--text-mute); }
    .spinner { margin-top: 1.25rem; font-size: 1.5rem; color: var(--brand); }
    .alert {
      margin-top: 1.25rem;
      padding: 0.75rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      line-height: 1.65;
      text-align: left;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
    }
    .alert.ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
    .hidden { display: none !important; }
    .actions { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.55rem; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.6rem 1rem;
      border-radius: 0.55rem;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface);
    }
    a.btn:hover { background: var(--bg); }
    a.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    a.btn.primary:hover { background: var(--brand-dark); }
    .foot { margin-top: 1.25rem; font-size: 0.7rem; color: var(--text-faint); }
  </style>
</head>
<body>
  <div class="card">
    <img class="crest" src="https://cdn.sibh.cn/img/2026/08/6a82000f8ce84.png" alt="Sibaihua University Crest">
    <h1 id="title">正在完成登录…</h1>
    <p class="lede" id="lede">正在与 pan.sibh.cn 校验身份，请稍候。</p>
    <div class="spinner" id="spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
    <div class="alert hidden" id="alert"></div>
    <div class="actions hidden" id="actions">
      <a class="btn primary" id="retryBtn" href="/admin.html"><i class="fa-solid fa-right-to-bracket"></i>返回登录</a>
      <a class="btn" href="/"><i class="fa-solid fa-house"></i>回到首页</a>
    </div>
    <div class="foot">Sibaihua University · 清迈分校</div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var error = params.get('error');
      var code = params.get('code');
      var state = params.get('state');

      var titleEl = document.getElementById('title');
      var ledeEl = document.getElementById('lede');
      var spinnerEl = document.getElementById('spinner');
      var alertEl = document.getElementById('alert');
      var actionsEl = document.getElementById('actions');

      function finish(kind, title, message) {
        spinnerEl.classList.add('hidden');
        titleEl.textContent = title;
        ledeEl.textContent = message;
        if (message) {
          alertEl.textContent = message;
          alertEl.classList.remove('hidden');
          alertEl.classList.toggle('ok', kind === 'ok');
        }
        actionsEl.classList.remove('hidden');
      }

      function decodeProviderError(value) {
        var map = {
          access_denied: '你在授权页取消了登录，或者该账号未被允许。',
          invalid_request: '授权请求有误（回调地址与 pan.sibh.cn 上登记的不一致？）。',
          unauthorized_client: '该 OAuth 应用不被允许使用这种授权方式。',
          unsupported_response_type: '该 OAuth 应用不支持授权码模式。',
          invalid_scope: '申请的权限超出了该 OAuth 应用允许的范围。',
          server_error: 'pan.sibh.cn 侧出错，请稍后再试。',
          temporarily_unavailable: 'pan.sibh.cn 暂时不可用，请稍后再试。'
        };
        return map[value] || ('授权失败：' + value);
      }

      if (error) {
        finish('error', '登录未完成', decodeProviderError(error));
        return;
      }
      if (!code || !state) {
        finish('error', '登录未完成', '回调里没有授权码，请重新发起登录。');
        return;
      }

      fetch('/api/auth/oauth/callback', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, state: state })
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { status: res.status, data: data };
          });
        })
        .then(function (result) {
          if (result.status !== 200) {
            finish('error', '登录失败', (result.data && result.data.message) || '未知错误');
            return;
          }
          var target = (result.data && result.data.data && result.data.data.return_to) || '/admin.html';
          finish('ok', '登录成功', '');
          ledeEl.textContent = '正在进入编辑控制台…';
          setTimeout(function () { location.replace(target); }, 600);
        })
        .catch(function () {
          finish('error', '登录失败', '无法连接本站 API，请检查网络后重试。');
        });
    })();
  </script>
</body>
</html>
